version: 2

models:
  - name: stg_comptes
    description: "Comptes clients nettoyés — renommage des colonnes, uniformisation du statut"
    columns:
      - name: compte_id
        description: "Identifiant unique du compte"
        tests:
          - unique
          - not_null
      - name: type_compte
        tests:
          - accepted_values:
              values: ['courant', 'epargne', 'joint']
      - name: statut
        tests:
          - accepted_values:
              values: ['actif', 'inactif', 'cloture']

  - name: stg_transactions
    description: "Transactions nettoyées avec montant signé calculé"
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: compte_id
        tests:
          - relationships:
              to: ref('stg_comptes')
              field: compte_id

  - name: stg_categories
    description: "Catégories de transactions nettoyées"
    columns:
      - name: categorie_id
        tests:
          - unique
          - not_null

  - name: stg_budgets
    description: "Budgets mensuels nettoyés"
    columns:
      - name: budget_id
        tests:
          - unique
          - not_null

  - name: stg_virements
    description: "Virements internes nettoyés (un virement = un compte source vers un compte destination)"
    columns:
      - name: virement_id
        description: "Identifiant unique du virement"
        tests:
          - unique
          - not_null
      - name: compte_source_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_comptes')
              field: compte_id
      - name: compte_dest_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_comptes')
              field: compte_id
      - name: montant
        tests:
          - not_null
      - name: statut
        tests:
          - accepted_values:
              values: ['execute', 'en_attente', 'annule']
      - name: motif
        description: "Libellé libre saisi par le client"
        tests:
          # Section 5.3 : test générique maison, max 10 % de motifs vides
          - taux_null:
              seuil_pct: 10

  - name: stg_alertes
    description: "Alertes de dépassement de budget, enrichies avec la sévérité (seed seuils_alerte)"
    columns:
      - name: alerte_id
        tests:
          - unique
          - not_null
      - name: type_alerte
        tests:
          - relationships:
              to: ref('seuils_alerte')
              field: code_alerte
      - name: severite
        tests:
          - not_null
          - accepted_values:
              values: ['warning', 'critical', 'urgent']
